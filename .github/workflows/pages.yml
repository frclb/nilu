# Siteyi (gizlilik, şartlar, destek; 6 dil) üretip GitHub Pages'e yükler.
#
# Bir kez: depo → Settings → Pages → Source: "GitHub Actions".
# Metinler uygulamanın sözlüğünden üretildiği için sözlük değişince site de
# yeniden yayımlanıyor — politikanın iki kopyası ayrışmasın.
name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - lib/localization/**
      - lib/core/release_config.dart
      - tool/build_site.dart
      - tool/release_values.dart
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/build_site.dart build/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
