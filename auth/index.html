<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#22001a">
<link rel="stylesheet" href="../assets/style.css">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<title>Nilu</title>
</head>
<body class="page-root page-invite">
<main class="root-box invite-box">
<img src="../assets/icon-256.png" alt="" width="96" height="96">
<h1 id="t">Nilu</h1>
<p id="b" role="status"></p>
<form id="f" class="auth-form" hidden>
<p><label id="sl" for="s"></label>
<input id="s" type="password" autocomplete="new-password" minlength="8" required></p>
<p id="sh" class="muted"></p>
<p id="se" class="auth-error" role="alert" hidden></p>
<p><button id="sb" class="button" type="submit"></button></p>
</form>
<p><a id="ac" class="button" href="#" hidden></a></p>
<p><a id="ap" class="auth-link" href="#" hidden></a></p>
</main>
<script>
(function () {
  var t = {
 "tr": {
  "auth_verify_title": "E-posta doğrulama",
  "auth_verify_working": "E-postan doğrulanıyor…",
  "auth_verify_done": "E-postan doğrulandı. Nilu'ya dönüp devam edebilirsin.",
  "auth_verify_failed": "Bu bağlantı geçersiz, kullanılmış ya da süresi dolmuş. Nilu'da “Bağlantıyı tekrar gönder”e dokun.",
  "auth_back_to_app": "Nilu'ya dön",
  "auth_reset_title": "Yeni şifre belirle",
  "auth_reset_for": "%EMAIL% hesabı için yeni şifreni yaz.",
  "auth_reset_label": "Yeni şifre",
  "auth_reset_hint": "En az 8 karakter",
  "auth_reset_button": "Şifreyi değiştir",
  "auth_reset_in_app": "Nilu'da aç",
  "auth_reset_short": "Şifre en az 8 karakter olmalı.",
  "auth_reset_done": "Şifren değişti. Nilu'da yeni şifrenle giriş yapabilirsin.",
  "auth_reset_failed": "Bu bağlantı geçersiz, kullanılmış ya da süresi dolmuş. Nilu'da “Şifremi unuttum” ile yeni bağlantı iste.",
  "auth_error": "Bir sorun oldu. Bağlantını kontrol edip yeniden dene.",
  "auth_unknown": "Bu bağlantı tanınmadı."
 },
 "en": {
  "auth_verify_title": "Email verification",
  "auth_verify_working": "Verifying your email…",
  "auth_verify_done": "Your email is verified. You can go back to Nilu and continue.",
  "auth_verify_failed": "This link is invalid, already used or expired. In Nilu, tap “Send the link again”.",
  "auth_back_to_app": "Back to Nilu",
  "auth_reset_title": "Set a new password",
  "auth_reset_for": "Enter a new password for %EMAIL%.",
  "auth_reset_label": "New password",
  "auth_reset_hint": "At least 8 characters",
  "auth_reset_button": "Change password",
  "auth_reset_in_app": "Open in Nilu",
  "auth_reset_short": "Password must be at least 8 characters.",
  "auth_reset_done": "Your password has been changed. You can sign in to Nilu with your new password.",
  "auth_reset_failed": "This link is invalid, already used or expired. In Nilu, use “Forgot password?” to get a new one.",
  "auth_error": "Something went wrong. Check your connection and try again.",
  "auth_unknown": "This link wasn’t recognised."
 },
 "de": {
  "auth_verify_title": "E-Mail-Bestätigung",
  "auth_verify_working": "Deine E-Mail wird bestätigt …",
  "auth_verify_done": "Deine E-Mail ist bestätigt. Du kannst zu Nilu zurückkehren und weitermachen.",
  "auth_verify_failed": "Dieser Link ist ungültig, schon benutzt oder abgelaufen. Tippe in Nilu auf „Link erneut senden“.",
  "auth_back_to_app": "Zurück zu Nilu",
  "auth_reset_title": "Neues Passwort festlegen",
  "auth_reset_for": "Gib ein neues Passwort für %EMAIL% ein.",
  "auth_reset_label": "Neues Passwort",
  "auth_reset_hint": "Mindestens 8 Zeichen",
  "auth_reset_button": "Passwort ändern",
  "auth_reset_in_app": "In Nilu öffnen",
  "auth_reset_short": "Das Passwort muss mindestens 8 Zeichen haben.",
  "auth_reset_done": "Dein Passwort wurde geändert. Du kannst dich in Nilu mit dem neuen Passwort anmelden.",
  "auth_reset_failed": "Dieser Link ist ungültig, schon benutzt oder abgelaufen. Fordere in Nilu über „Passwort vergessen?“ einen neuen an.",
  "auth_error": "Etwas ist schiefgelaufen. Prüfe deine Verbindung und versuche es noch einmal.",
  "auth_unknown": "Dieser Link wurde nicht erkannt."
 },
 "es": {
  "auth_verify_title": "Verificación del correo",
  "auth_verify_working": "Verificando tu correo…",
  "auth_verify_done": "Tu correo está verificado. Puedes volver a Nilu y continuar.",
  "auth_verify_failed": "Este enlace no es válido, ya se usó o ha caducado. En Nilu, toca «Enviar el enlace de nuevo».",
  "auth_back_to_app": "Volver a Nilu",
  "auth_reset_title": "Elige una contraseña nueva",
  "auth_reset_for": "Escribe una contraseña nueva para %EMAIL%.",
  "auth_reset_label": "Contraseña nueva",
  "auth_reset_hint": "Al menos 8 caracteres",
  "auth_reset_button": "Cambiar contraseña",
  "auth_reset_in_app": "Abrir en Nilu",
  "auth_reset_short": "La contraseña debe tener al menos 8 caracteres.",
  "auth_reset_done": "Tu contraseña se ha cambiado. Ya puedes iniciar sesión en Nilu con la nueva.",
  "auth_reset_failed": "Este enlace no es válido, ya se usó o ha caducado. En Nilu, usa «¿Olvidaste tu contraseña?» para pedir otro.",
  "auth_error": "Algo salió mal. Revisa tu conexión e inténtalo de nuevo.",
  "auth_unknown": "No se ha reconocido este enlace."
 },
 "fr": {
  "auth_verify_title": "Vérification de l’e-mail",
  "auth_verify_working": "Vérification de ton e-mail…",
  "auth_verify_done": "Ton e-mail est vérifié. Tu peux revenir dans Nilu et continuer.",
  "auth_verify_failed": "Ce lien n’est pas valide, a déjà servi ou a expiré. Dans Nilu, touche « Renvoyer le lien ».",
  "auth_back_to_app": "Revenir dans Nilu",
  "auth_reset_title": "Choisis un nouveau mot de passe",
  "auth_reset_for": "Saisis un nouveau mot de passe pour %EMAIL%.",
  "auth_reset_label": "Nouveau mot de passe",
  "auth_reset_hint": "Au moins 8 caractères",
  "auth_reset_button": "Changer le mot de passe",
  "auth_reset_in_app": "Ouvrir dans Nilu",
  "auth_reset_short": "Le mot de passe doit contenir au moins 8 caractères.",
  "auth_reset_done": "Ton mot de passe a été modifié. Tu peux te connecter à Nilu avec le nouveau.",
  "auth_reset_failed": "Ce lien n’est pas valide, a déjà servi ou a expiré. Dans Nilu, utilise « Mot de passe oublié ? » pour en demander un nouveau.",
  "auth_error": "Un problème est survenu. Vérifie ta connexion et réessaie.",
  "auth_unknown": "Ce lien n’a pas été reconnu."
 },
 "pt": {
  "auth_verify_title": "Confirmação de e-mail",
  "auth_verify_working": "Confirmando seu e-mail…",
  "auth_verify_done": "Seu e-mail foi confirmado. Você pode voltar ao Nilu e continuar.",
  "auth_verify_failed": "Este link é inválido, já foi usado ou expirou. No Nilu, toque em “Enviar o link de novo”.",
  "auth_back_to_app": "Voltar ao Nilu",
  "auth_reset_title": "Defina uma nova senha",
  "auth_reset_for": "Digite uma nova senha para %EMAIL%.",
  "auth_reset_label": "Nova senha",
  "auth_reset_hint": "Pelo menos 8 caracteres",
  "auth_reset_button": "Alterar senha",
  "auth_reset_in_app": "Abrir no Nilu",
  "auth_reset_short": "A senha precisa ter pelo menos 8 caracteres.",
  "auth_reset_done": "Sua senha foi alterada. Você já pode entrar no Nilu com a nova senha.",
  "auth_reset_failed": "Este link é inválido, já foi usado ou expirou. No Nilu, use “Esqueci a senha” para pedir outro.",
  "auth_error": "Algo deu errado. Verifique sua conexão e tente de novo.",
  "auth_unknown": "Este link não foi reconhecido."
 }
};
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode'), kod = q.get('oobCode'), key = q.get('apiKey');
  var lang = (q.get('lang') || '').slice(0, 2).toLowerCase();
  if (!t[lang]) {
    lang = 'tr';
    var prefs = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < prefs.length; i++) {
      var c = (prefs[i] || '').slice(0, 2).toLowerCase();
      if (t[c]) { lang = c; break; }
    }
  }
  var s = t[lang];
  document.documentElement.lang = lang;
  function el(id) { return document.getElementById(id); }
  function yaz(id, metin) { el(id).textContent = metin; }
  function dugme(id, metin, adres) { var a = el(id); a.textContent = metin; a.href = adres; a.hidden = false; }
  function istek(yol, govde) {
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:' + yol + '?key=' + encodeURIComponent(key), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(govde)
    }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw j; return j; });
    });
  }
  function kodHatasi(e) {
    var m = (e && e.error && e.error.message) || '';
    return /OOB_CODE|EXPIRED|USER_NOT_FOUND|USER_DISABLED/.test(m);
  }
  var uygulama = 'nilu://auth?mode=verified';

  // Firebase'in sayfasında iş bitti, "Devam" buraya getirdi (uygulama
  // yüklüyse bu adres sayfayı değil uygulamayı açıyor).
  if (mode === 'verified' || mode === 'resetDone') {
    var bitti = mode === 'verified' ? s.auth_verify_title : s.auth_reset_title;
    document.title = bitti;
    yaz('t', bitti);
    yaz('b', mode === 'verified' ? s.auth_verify_done : s.auth_reset_done);
    dugme('ac', s.auth_back_to_app, uygulama);
    return;
  }

  if (!kod || !key) { yaz('b', s.auth_unknown); return; }

  if (mode === 'verifyEmail') {
    document.title = s.auth_verify_title;
    yaz('t', s.auth_verify_title);
    yaz('b', s.auth_verify_working);
    istek('update', { oobCode: kod }).then(function () {
      yaz('b', s.auth_verify_done);
      dugme('ac', s.auth_back_to_app, uygulama);
    }, function (e) {
      yaz('b', kodHatasi(e) ? s.auth_verify_failed : s.auth_error);
      dugme('ac', s.auth_back_to_app, uygulama);
    });
    return;
  }

  if (mode === 'resetPassword') {
    document.title = s.auth_reset_title;
    yaz('t', s.auth_reset_title);
    istek('resetPassword', { oobCode: kod }).then(function (j) {
      yaz('b', s.auth_reset_for.replace('%EMAIL%', j.email || ''));
      yaz('sl', s.auth_reset_label);
      yaz('sh', s.auth_reset_hint);
      yaz('sb', s.auth_reset_button);
      el('f').hidden = false;
      dugme('ap', s.auth_reset_in_app, 'nilu://auth?mode=resetPassword&oobCode=' + encodeURIComponent(kod));
    }, function (e) {
      yaz('b', kodHatasi(e) ? s.auth_reset_failed : s.auth_error);
    });
    el('f').addEventListener('submit', function (olay) {
      olay.preventDefault();
      var sifre = el('s').value;
      var hata = el('se');
      if (sifre.length < 8) { hata.textContent = s.auth_reset_short; hata.hidden = false; return; }
      hata.hidden = true;
      el('sb').disabled = true;
      istek('resetPassword', { oobCode: kod, newPassword: sifre }).then(function () {
        el('f').hidden = true;
        el('ap').hidden = true;
        yaz('b', s.auth_reset_done);
        dugme('ac', s.auth_back_to_app, uygulama);
      }, function (e) {
        el('sb').disabled = false;
        hata.textContent = kodHatasi(e) ? s.auth_reset_failed : s.auth_error;
        hata.hidden = false;
      });
    });
    return;
  }

  yaz('b', s.auth_unknown);
})();
</script>
</body>
</html>
