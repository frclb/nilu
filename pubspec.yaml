name: period_tracker
description: "Nilu — regl, gebelik ve lohusalık takibi. Veriler cihazda kalır."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  go_router: ^17.1.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  uuid: ^4.5.3
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  purchases_flutter: ^10.4.0
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # Uygulama kilidi: Face ID / Touch ID / parmak izi, cihaz şifresine düşer.
  # Kendi PIN'imizi saklamıyoruz — parola saklamamak en güvenlisi.
  local_auth: ^2.3.0
  # Veri dışa aktarma: dosya olarak paylaş. Sağlık verisi panoya konmamalı.
  share_plus: ^13.3.0
  # Yedeği geri yüklemek için dosya seçimi. flutter.dev tarafından
  # sürdürülüyor; iOS'ta sistem belge seçicisini açıyor.
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  health: ^13.3.2
  home_widget: ^0.9.3
  url_launcher: ^6.3.2
  google_mobile_ads: ^9.1.0
  cryptography: ^2.9.0
  crypto: ^3.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  # Simülatörde gerçek uygulamayla uçtan uca akışlar (integration_test/).
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Uygulama ikonu. Kaynak görseli `python3 tool/generate_icon.py` üretir,
# platform boyutlarını `dart run flutter_launcher_icons` oluşturur.
# DİKKAT: araç Runner.xcodeproj'daki ALTERNATE_APPICON_NAMES değerini
# `AppIcon` yapıp sade simgeyi bozuyor; çalıştırdıktan sonra
# `git checkout -- ios/Runner.xcodeproj/project.pbxproj` (bkz.
# test/tool/ios_alternate_icon_test.dart).
# Uygulama yalnızca iOS için çıkıyor. `android:` anahtarları buradayken
# `dart run flutter_launcher_icons` Android'i önce üretmeye çalışıp
# AndroidManifest.xml bulamadan çöküyor ve iOS ikonlarına hiç sıra gelmiyor.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true          # App Store şeffaflık kabul etmiyor

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - lib/localization/
    # Görünüm ekranındaki simge önizlemeleri (ana ekran simgesinin kendisi
    # Assets.xcassets içinde).
    - assets/icon/previews/
    # Apple ile giriş düğmesinin logosu: Apple Design Resources'tan,
    # Apple'ın lisansıyla yalnızca uygulama arayüzünde (bkz. SignInButton).
    - assets/brand/apple/

  # Yazı tipleri pakete gömülü.
  #
  # Önce `google_fonts` kullanılıyordu ve dosyaları **çalışma anında**
  # fonts.gstatic.com'dan indiriyordu: ilk açılışta ağ yavaşsa uygulama
  # sistem yazı tipiyle açılıp sonra bir anda değişiyordu, üstelik tamamen
  # görsel bir şey için ağa ve Google'a bağımlıydı. "Verilerin cihazında
  # kalır" diyen bir uygulamada ilk açılışta dışarı istek gitmesi tutarsızdı.
  #
  # Yalnızca kullanılan kalınlıklar var (tasarımda 400/500/600/700 geçiyor).
  # Tek bir 800 kullanımı için ayrı dosya taşınmıyor; Flutter en yakın
  # kalınlığa düşüyor.
  fonts:
    # Başlıklar Newsreader (serif), gövde Plus Jakarta Sans. İkisi de
    # Google Fonts'tan, OFL lisanslı (assets/fonts/*-OFL.txt). Değişken
    # yazı tiplerinden sabit kalınlıklar üretildi: Flutter `fontWeight`'i
    # değişken eksene kendiliğinden bağlamıyor.
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
